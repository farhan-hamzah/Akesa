services:
  postgres:
    image: postgres:17
    container_name: akesa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: akesa
      POSTGRES_PASSWORD: akesa_dev_password
      POSTGRES_DB: akesa
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: